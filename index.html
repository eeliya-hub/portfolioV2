      serif editorial default already on this domain.

      STORY: a name at architectural scale, a Persian signature written across
      it, seven openable files, a crimson close.

      scale, the portrait standing between them with the head clear above the
      type, ایلیا نیری signed in madder in the open quarter under the first
      line; actions bottom-left, status bottom-right.
      SIGNATURE INTERACTION: the selvedge — a woven edge down both margins
      that is also the progress indicator. Each chapter owns a station;
      arriving strikes its shamsa onto the ghost drawn on the cartoon.
      FORM: naqsheh, candidate 7 of the grounded list. Seed b052b99d.
