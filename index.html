    <!-- Set the edition before first paint, so a night visitor never sees the
         ivory flash past, and whether the overture plays, which is once a
         session. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('edition');
          if (t !== 'day' && t !== 'night') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
          }
          root.dataset.theme = t;
        } catch (e) {
          root.dataset.theme = 'day';
        }
        // Storage blocked plays it again: a better failure than never.
        var seen = false;
        try {
          seen = sessionStorage.getItem('overture') === '1';
        } catch (e) {}
        root.dataset.overture = seen ? 'seen' : 'play';
      })();
    </script>

    <!-- The overture's own rules, here beside the head rather than in the
         stylesheet, so they hold before the stylesheet and the script that
         would otherwise draw it have arrived. Its markup opens the body; the
         landing is Overture.jsx's. -->
    <style>
      .overture {
        /* One knot of the mark, in whole pixels so it stands crisp at rest. */
        --mark-knot: 12px;
        position: fixed;
        inset: 0;
        z-index: 400;
        display: grid;
        place-items: center;
        color: var(--accent, #8e1c24);
      }

      /* Later in the session the page comes from the cache, and there is
         nothing to wait for. */
      [data-overture='seen'] .overture {
        display: none;
      }

      .overture__ground {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--ground, #f1e9d9);
      }

      /* The squared paper the mark is knotted on: the weaver's cartoon, a
         cell to a knot, fading out past the mark. */
      .overture__cartoon {
        width: calc(var(--mark-knot) * 17);
        height: calc(var(--mark-knot) * 17);
        overflow: visible;
        color: var(--ink, #1a1512);
        opacity: 0.12;
        -webkit-mask-image: radial-gradient(closest-side, #000 40%, transparent);
        mask-image: radial-gradient(closest-side, #000 40%, transparent);
      }

      .overture__cartoon path {
        fill: none;
        stroke: currentcolor;
        stroke-width: 1px;
        vector-effect: non-scaling-stroke;
      }

      .overture__flight {
        position: relative;
      }

      .overture__flight,
      .overture__spin,
      .overture__knots {
        display: block;
        width: calc(var(--mark-knot) * 9);
        height: calc(var(--mark-knot) * 9);
      }

      .overture__knots path {
        fill: currentcolor;
      }

      [data-theme='night'] .overture {
        color: var(--accent, #e08c7d);
      }

      [data-theme='night'] .overture__ground {
        background: var(--ground, #121010);
      }

      [data-theme='night'] .overture__cartoon {
        color: var(--ink, #f0e5d1);
      }

      /* ایلیا is written in from the right, a column of knots at a time, the
         way the name is written: the lone alef, the break after it, then the
         joined run to the last alef. */
      [data-overture='play'] .overture__knots {
        animation: overture-write 450ms steps(9, end) both;
      }

      /* Then it turns, slowly at first, and is spinning at full speed by the
         end of its first revolution. It goes on spinning until the page is
         ready; Overture.jsx takes it from wherever it is and lands it on the
         E. The spin-up is a quadratic ease-in over two periods, so it leaves
         the first revolution at exactly the speed the spin runs at. */
      [data-overture='play'] .overture__spin {
        animation:
          overture-spin-up 2400ms cubic-bezier(0.333, 0, 0.667, 0.333) 600ms both,
          overture-spin 1200ms linear 3000ms infinite;
      }

      @keyframes overture-write {
        from {
          clip-path: inset(0 0 0 100%);
        }

        to {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes overture-spin-up {
        from {
          rotate: 0deg;
        }

        to {
          rotate: 360deg;
        }
      }

      @keyframes overture-spin {
        from {
          rotate: 0deg;
        }

        to {
          rotate: 360deg;
        }
      }

      @media (max-width: 40rem) {
        .overture {
          --mark-knot: 10px;
        }
      }

      /* Still: the E, standing, for as long as the page takes. */
      @media (prefers-reduced-motion: reduce) {
        .overture .overture__knots,
        .overture .overture__spin {
          animation: none !important;
        }

        .overture .overture__spin {
          rotate: 90deg;
        }
      }
    </style>

    <!--
      THESIS: This page is the carpet its naqsheh was the plan for, read
      lengthwise: colour-blocked bands woven downward as you scroll, one warp
      thread filling at the edge, the cloth cut off the loom at the foot.
      Refuses both the dark-mode dev portfolio and the five-framed-pages book
      this site used to be.
      OWN-WORLD: ivory parchment / lacquer black in two art-directed editions;
      madder crimson as FIELD not accent; terracotta and sand; Archivo width
      axis for display, Markazi for copy, Vazirmatn for Persian. No radius
      anywhere. Controls are double-ruled cartouches that ink in from the foot.
      STORY: a name at architectural scale, then six bands: the album, seven
      full-screen plates stacking in the dark, eight years ridden sideways on
      one thread, five registers running as border patterns, a crimson close.
      FIRST VIEWPORT: EELIYA and NAYERI set to opposite margins at display
      scale, the portrait standing between them with the head clear above the
      type, ایلیا نیری signed in madder in the open quarter under the first
      line; actions bottom-left, status bottom-right.
      SIGNATURE INTERACTION: scroll as the loom: the deck of plates pins and
      stacks, the route turns scroll into sideways travel along the thread,
      the skill bands run, and the warp at the right edge fills with --woven.
      FORM: naqsheh, the carpet read lengthwise. Seed b052b99d, renovation 3.0.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->

    <!-- The overture: ایلیا, written in knots and turned a quarter to stand
         as the E, spinning on the cartoon while the page it is waiting for
         arrives, then home to the square at the top left. Its paths are
         filled in at build from src/lib/mark.js (vite.config.js), its rules
         are in the head, and Overture.jsx lands it. -->
    <div class="overture" id="overture" aria-hidden="true">
      <div class="overture__ground">
        <svg class="overture__cartoon" viewBox="-4 -4 17 17" focusable="false">
          <path data-mark="cartoon" />
        </svg>
      </div>
      <div class="overture__flight">
        <div class="overture__spin">
          <svg class="overture__knots" viewBox="0 0 9 9" focusable="false">
            <path data-mark="knots" />
          </svg>
        </div>
      </div>
    </div>
